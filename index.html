<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta id="dynamic-viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:">
  <title>index</title>
  
  <style id="original-styles">
    body {
      color: #ffffff;
      font-family: sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    :root, body.is-fullscreen {
      background-color: #000000;
    }
    [hidden] {
      display: none !important;
    }
    h1 {
      font-weight: normal;
    }
    a {
      color: inherit;
      text-decoration: underline;
      cursor: pointer;
    }

    #app, #loading, #error, #launch {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
      background-color: #000000;
    }
    #launch {
      background-color: rgba(0, 0, 0, 0.7);
      cursor: pointer;
    }
    .green-flag {
      width: 80px;
      height: 80px;
      padding: 16px;
      border-radius: 100%;
      background: rgba(255, 255, 255, 0.75);
      border: 3px solid hsla(0, 100%, 100%, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }
    #loading {
      
    }
    .progress-bar-outer {
      border: 1px solid currentColor;
      height: 10px;
      width: 200px;
      max-width: 200px;
    }
    .progress-bar-inner {
      height: 100%;
      width: 0;
      background-color: currentColor;
    }
    .loading-text, noscript {
      font-weight: normal;
      font-size: 36px;
      margin: 0 0 16px;
    }
    .loading-image {
      margin: 0 0 16px;
    }
    #error-message, #error-stack {
      font-family: monospace;
      max-width: 600px;
      white-space: pre-wrap;
      user-select: text;
      -webkit-user-select: text;
    }
    #error-stack {
      text-align: left;
      max-height: 200px;
      overflow: auto;
    }
    .control-button {
      width: 2rem;
      height: 2rem;
      padding: 0.375rem;
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
      border: 0;
      border-radius: 4px;
    }
    .control-button-highlight:hover {
      background: #ff4c4c26;
    }
    .control-button-highlight.active {
      background: #ff4c4c59;
    }
    .fullscreen-button {
      background: white;
    }
    .standalone-fullscreen-button {
      position: absolute;
      top: 0;
      right: 0;
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 0 0 0 4px;
      padding: 4px;
      cursor: pointer;
    }
    .sc-canvas {
      cursor: auto;
    }
    .sc-monitor-root[data-opcode^="data_"] .sc-monitor-value-color {
      background-color: #ff8c1a;
    }
    .sc-monitor-row-value-outer {
      background-color: #fc662c;
    }
    .sc-monitor-row-value-editing .sc-monitor-row-value-outer {
      background-color: #e25b27;
    }
  </style>

  <style id="optimized-styles">
    /* Android環境特有のタッチバグ・スクロール遅延対策、レンダリング最適化 */
    body, #app, .screen, canvas, .sc-canvas {
      touch-action: none; /* ピンチズームやダブルタップズーム、不要なスクロールを無効化しタッチ追従性を爆上げ */
      -webkit-tap-highlight-color: transparent; /* タップ時の青いハイライトを消去 */
    }
    #app {
      /* AndroidのGPUレンダリングを強制活性化してラグを減らす */
      transform: translate3d(0,0,0);
      will-change: transform;
    }
    canvas, .sc-canvas {
      /* 画面引き伸ばし時のドットのボケをAndroidブラウザ（Chrome等）向けに最適化 */
      image-rendering: -webkit-optimize-contrast;
      image-rendering: pixelated;
    }
  </style>

  <meta name="theme-color" content="#000000">

  <script>
    (function() {
      const ua = navigator.userAgent.toLowerCase();
      
      // iOS（iPhone）またはiPad（iPadOS。※近年のiPadはMacintoshとして検出される場合があるため、タッチポイント数も確認）の判定
      const isIOS = /iphone|ipad|ipod/.test(ua);
      const isIPadOS = (/macintosh/.test(ua) && navigator.maxTouchPoints > 1);

      if (isIOS || isIPadOS) {
        // --- iOS / iPad の場合 ---
        // 最適化用スタイルを無効化し、送っていただいたオリジナルのまま動作
        document.addEventListener("DOMContentLoaded", function() {
          const optStyle = document.getElementById('optimized-styles');
          if (optStyle) optStyle.remove();
        });
        console.log("Device: iOS/iPad - Original HTML layout applied.");
      } else {
        // --- Galaxy S10 / Google系タブレット / Android の場合 ---
        // ビューポートをAndroid向け（ノッチやパンチホール部分までフル表示する viewport-fit=cover）に上書き
        const viewport = document.getElementById('dynamic-viewport');
        if (viewport) {
          viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
        }
        console.log("Device: s10/Google/Android - Optimized HTML layout applied.");
      }
    })();
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="launch" class="screen" hidden title="Click to start">
    <div class="green-flag">
      <svg viewBox="0 0 16.63 17.5" width="42" height="44">
        <defs><style>.cls-1,.cls-2{fill:#4cbf56;stroke:#45993d;stroke-linecap:round;stroke-linejoin:round;}.cls-2{stroke-width:1.5px;}</style></defs>
        <path class="cls-1" d="M.75,2A6.44,6.44,0,0,1,8.44,2h0a6.44,6.44,0,0,0,7.69,0V12.4a6.44,6.44,0,0,1-7.69,0h0a6.44,6.44,0,0,0-7.69,0"/>
        <line class="cls-2" x1="0.75" y1="16.75" x2="0.75" y2="0.75"/>
      </svg>
    </div>
  </div>

  <div id="loading" class="screen">
    <noscript>Enable JavaScript</noscript>
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="loading-inner"></div></div>
  </div>

  <div id="error" class="screen" hidden>
    <h1>Error</h1>
    <details>
      <summary id="error-message"></summary>
      <p id="error-stack"></p>
    </details>
  </div>
